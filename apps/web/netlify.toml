[build]
publish = "apps/web/dist"
command = "npm run build"

[[redirects]]
from = "/services/developers"
to = "/who-we-work-with/developers/"
status = 301

[[redirects]]
from = "/services/residential"
to = "/who-we-work-with/rmc-and-rtm-directors/"
status = 301

[[redirects]]
from = "/services/freeholders"
to = "/who-we-work-with/freeholders-and-private-landlords/"
status = 301

[[redirects]]
from = "/our-team"
to = "/about/"
status = 301

[[redirects]]
from = "/about-us"
to = "/about/"
status = 301

[[redirects]]
from = "/about-us/links"
to = "/about/"
status = 301

[[redirects]]
from = "/contact-us"
to = "/contact/"
status = 301

[[headers]]
for = "/*"
[headers.values]
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Content-Security-Policy = "frame-ancestors 'none'"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[plugins]]
package = "@netlify/plugin-lighthouse"

[[plugins.inputs.audits]]
path = "/"

[[plugins.inputs.audits]]
path = "/services/"

[[plugins.inputs.audits]]
path = "/services/block-and-estate-management/"

[[plugins.inputs.audits]]
path = "/who-we-work-with/rmc-and-rtm-directors/"

[[plugins.inputs.audits]]
path = "/about/"

[[plugins.inputs.audits]]
path = "/faqs/"

[[plugins.inputs.audits]]
path = "/contact/"

[[plugins.inputs.audits]]
path = "/privacy-policy/"
